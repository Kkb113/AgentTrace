name: AgentTrace Validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.12
      - run: uv sync --frozen --all-groups
      - run: uv run python scripts/ci-checks.py quality
  validation:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [security, infrastructure, integration, guard-controls]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.12
      - run: uv sync --frozen --all-groups
      - run: uv run python scripts/bootstrap-tools.py all
      - run: uv run python scripts/ci-checks.py '${{ matrix.gate }}'
      - if: always() && matrix.gate == 'integration'
        run: uv run python scripts/dev-services.py stop
