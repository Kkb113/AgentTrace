[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace-feasibility"
version = "0.1.0"
description = "Read-only evidence feasibility checks for AgentTrace"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.2", "msal==1.39.0"]

[project.scripts]
agenttrace-feasibility = "agenttrace_feasibility.cli:main"

[dependency-groups]
dev = ["ruff==0.14.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
